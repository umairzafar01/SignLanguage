name: signbridge
description: AI-powered Sign Language Translator App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.4
  cloud_firestore: ^5.4.5
  firebase_auth: ^5.3.3
  firebase_core: ^3.6.0
  file_picker: ^8.1.2
  flutter_tts: ^4.2.5
  hand_landmarker: ^2.1.2
  image: ^4.8.0
  provider: ^6.1.2
  google_fonts: ^6.1.0
  curved_navigation_bar: ^1.0.3
  flutter_animate: ^4.3.0
  percent_indicator: ^4.2.3
  shared_preferences: ^2.2.2
  speech_to_text: ^7.0.0
  video_player: ^2.8.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/signlanguage/
