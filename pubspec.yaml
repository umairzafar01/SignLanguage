name: signbridge
description: AI-powered Sign Language Translator App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  curved_navigation_bar: ^1.0.3
  flutter_animate: ^4.3.0
  percent_indicator: ^4.2.3
  shared_preferences: ^2.2.2
  provider: ^6.1.5+1
  get: ^4.6.6
  avatar_glow: ^2.0.2
  speech_to_text: ^6.1.1
  flutter_tts: ^4.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/signlanguage/
